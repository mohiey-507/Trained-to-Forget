<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');
      text { font-family: 'Geist', sans-serif; }
      .mono { font-family: 'Geist Mono', monospace; }
    </style>
    <marker id="arrowhead-resnet" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2d3142"/>
    </marker>
    <marker id="arrowhead-effnet" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#7c8f6f"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="560" fill="#f5f5f5"/>

  <!-- Subtle horizontal grid lines within trimmed box (x: 100 to 820, y: 55% to 85%) -->
  <line x1="100" y1="370" x2="820" y2="370" stroke="rgba(28,25,23,0.06)" stroke-width="0.8"/>
  <line x1="100" y1="310" x2="820" y2="310" stroke="rgba(28,25,23,0.06)" stroke-width="0.8"/>
  <line x1="100" y1="250" x2="820" y2="250" stroke="rgba(28,25,23,0.06)" stroke-width="0.8"/>
  <line x1="100" y1="190" x2="820" y2="190" stroke="rgba(28,25,23,0.06)" stroke-width="0.8"/>
  <line x1="100" y1="130" x2="820" y2="130" stroke="rgba(28,25,23,0.06)" stroke-width="0.8"/>
  <line x1="100" y1="70" x2="820" y2="70" stroke="rgba(28,25,23,0.06)" stroke-width="0.8"/>

  <!-- Subtle vertical grid lines within trimmed box (y: 70 to 430, x: 0.85 to 1.00) -->
  <line x1="244" y1="70" x2="244" y2="430" stroke="rgba(28,25,23,0.06)" stroke-width="0.8"/>
  <line x1="388" y1="70" x2="388" y2="430" stroke="rgba(28,25,23,0.06)" stroke-width="0.8"/>
  <line x1="532" y1="70" x2="532" y2="430" stroke="rgba(28,25,23,0.06)" stroke-width="0.8"/>
  <line x1="676" y1="70" x2="676" y2="430" stroke="rgba(28,25,23,0.06)" stroke-width="0.8"/>
  <line x1="820" y1="70" x2="820" y2="430" stroke="rgba(28,25,23,0.06)" stroke-width="0.8"/>

  <!-- SEABORN TRIM SPINES (Left & Bottom Only) -->
  <!-- Left Spine: from 55% (y=430) to 85% (y=70) -->
  <line x1="100" y1="70" x2="100" y2="430" stroke="#1c1917" stroke-width="1.3" stroke-linecap="round"/>

  <!-- Bottom Spine: from 0.85 (x=100) to 1.00 (x=820) -->
  <line x1="100" y1="430" x2="820" y2="430" stroke="#1c1917" stroke-width="1.3" stroke-linecap="round"/>

  <!-- Left Spine Tick Marks & Labels -->
  <line x1="94" y1="430" x2="100" y2="430" stroke="#1c1917" stroke-width="1.2"/>
  <text x="88" y="434" class="mono" font-size="10" fill="#78716c" text-anchor="end">55%</text>

  <line x1="94" y1="370" x2="100" y2="370" stroke="#1c1917" stroke-width="1.2"/>
  <text x="88" y="374" class="mono" font-size="10" fill="#78716c" text-anchor="end">60%</text>

  <line x1="94" y1="310" x2="100" y2="310" stroke="#1c1917" stroke-width="1.2"/>
  <text x="88" y="314" class="mono" font-size="10" fill="#78716c" text-anchor="end">65%</text>

  <line x1="94" y1="250" x2="100" y2="250" stroke="#1c1917" stroke-width="1.2"/>
  <text x="88" y="254" class="mono" font-size="10" fill="#78716c" text-anchor="end">70%</text>

  <line x1="94" y1="190" x2="100" y2="190" stroke="#1c1917" stroke-width="1.2"/>
  <text x="88" y="194" class="mono" font-size="10" fill="#78716c" text-anchor="end">75%</text>

  <line x1="94" y1="130" x2="100" y2="130" stroke="#1c1917" stroke-width="1.2"/>
  <text x="88" y="134" class="mono" font-size="10" fill="#78716c" text-anchor="end">80%</text>

  <line x1="94" y1="70" x2="100" y2="70" stroke="#1c1917" stroke-width="1.2"/>
  <text x="88" y="74" class="mono" font-size="10" fill="#78716c" text-anchor="end">85%</text>

  <!-- Bottom Spine Tick Marks & Labels -->
  <line x1="100" y1="430" x2="100" y2="436" stroke="#1c1917" stroke-width="1.2"/>
  <text x="100" y="450" class="mono" font-size="10" fill="#78716c" text-anchor="middle">0.85</text>

  <line x1="244" y1="430" x2="244" y2="436" stroke="#1c1917" stroke-width="1.2"/>
  <text x="244" y="450" class="mono" font-size="10" fill="#78716c" text-anchor="middle">0.88</text>

  <line x1="388" y1="430" x2="388" y2="436" stroke="#1c1917" stroke-width="1.2"/>
  <text x="388" y="450" class="mono" font-size="10" fill="#78716c" text-anchor="middle">0.91</text>

  <line x1="532" y1="430" x2="532" y2="436" stroke="#1c1917" stroke-width="1.2"/>
  <text x="532" y="450" class="mono" font-size="10" fill="#78716c" text-anchor="middle">0.94</text>

  <line x1="676" y1="430" x2="676" y2="436" stroke="#1c1917" stroke-width="1.2"/>
  <text x="676" y="450" class="mono" font-size="10" fill="#78716c" text-anchor="middle">0.97</text>

  <line x1="820" y1="430" x2="820" y2="436" stroke="#1c1917" stroke-width="1.2"/>
  <text x="820" y="450" class="mono" font-size="10" fill="#78716c" text-anchor="middle">1.00</text>

  <!-- Axis titles -->
  <text x="460" y="480" font-weight="600" font-size="12" fill="#1c1917" text-anchor="middle">Average CKA Similarity (← more forgetting)</text>
  <text x="38" y="250" transform="rotate(-90 38,250)" font-weight="600" font-size="12" fill="#1c1917" text-anchor="middle">Best Validation Accuracy</text>

  <!-- ==================== 1. RESNET-18 SERIES ==================== -->
  <!-- ResNet Trajectory Lines -->
  <!-- Dashed arrow V1→V2 -->
  <line x1="814" y1="367" x2="378" y2="194" stroke="#2d3142" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#arrowhead-resnet)"/>
  <!-- Dashed arrow V2→V3 -->
  <line x1="361" y1="190" x2="201" y2="184" stroke="#2d3142" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#arrowhead-resnet)"/>

  <!-- ResNet V1 (circle) -->
  <circle cx="820" cy="370" r="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1.5"/>
  <rect x="834" y="361" width="112" height="18" rx="4" fill="#f5f5f5"/>
  <text x="890" y="374" class="mono" font-size="10" fill="#2d3142" font-weight="600" text-anchor="middle">ResNet V1 (60.0%)</text>

  <!-- ResNet V2 (circle) -->
  <circle cx="369" cy="191" r="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1.5"/>
  <rect x="334" y="162" width="112" height="18" rx="4" fill="#f5f5f5"/>
  <text x="390" y="175" class="mono" font-size="10" fill="#2d3142" font-weight="600" text-anchor="middle">ResNet V2 (74.9%)</text>

  <!-- ResNet V3 (circle, focal) -->
  <circle cx="191" cy="184" r="7" fill="rgba(45,49,66,0.15)" stroke="#2d3142" stroke-width="1.8"/>
  <rect x="135" y="156" width="112" height="18" rx="4" fill="#f5f5f5"/>
  <text x="191" y="169" class="mono" font-size="10" fill="#2d3142" font-weight="700" text-anchor="middle">ResNet V3 (75.5%)</text>

  <!-- ResNet Trajectory Delta Badges -->
  <rect x="559" y="266" width="72" height="30" rx="4" fill="#f5f5f5" stroke="rgba(28,25,23,0.12)" stroke-width="0.6"/>
  <text x="595" y="279" class="mono" font-size="9" fill="#047857" font-weight="600" text-anchor="middle">+14.9% Acc</text>
  <text x="595" y="291" class="mono" font-size="8" fill="#eb6c36" font-weight="600" text-anchor="middle">−0.094 CKA</text>

  <rect x="244" y="170" width="72" height="30" rx="4" fill="#f5f5f5" stroke="rgba(28,25,23,0.12)" stroke-width="0.6"/>
  <text x="280" y="183" class="mono" font-size="9" fill="#047857" font-weight="600" text-anchor="middle">+0.6% Acc</text>
  <text x="280" y="195" class="mono" font-size="8" fill="#eb6c36" font-weight="600" text-anchor="middle">−0.037 CKA</text>

  <!-- ==================== 2. EFFICIENTNET-B2 SERIES ==================== -->
  <!-- EffNet Trajectory Lines -->
  <!-- Dashed arrow V1→V2 -->
  <line x1="814" y1="217" x2="632" y2="164" stroke="#7c8f6f" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#arrowhead-effnet)"/>
  <!-- Dashed arrow V2→V3 -->
  <line x1="616" y1="159" x2="432" y2="125" stroke="#7c8f6f" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#arrowhead-effnet)"/>

  <!-- EffNet V1 (square) -->
  <rect x="814" y="214" width="12" height="12" rx="2" fill="#f5f5f5"/>
  <rect x="814" y="214" width="12" height="12" rx="2" fill="rgba(124,143,111,0.25)" stroke="#7c8f6f" stroke-width="1.2"/>
  <rect x="834" y="211" width="112" height="18" rx="4" fill="#f5f5f5"/>
  <text x="890" y="224" class="mono" font-size="10" fill="#7c8f6f" font-weight="600" text-anchor="middle">EffNet V1 (72.5%)</text>

  <!-- EffNet V2 (square) -->
  <rect x="617" y="155" width="12" height="12" rx="2" fill="#f5f5f5"/>
  <rect x="617" y="155" width="12" height="12" rx="2" fill="rgba(124,143,111,0.25)" stroke="#7c8f6f" stroke-width="1.2"/>
  <rect x="589" y="132" width="112" height="18" rx="4" fill="#f5f5f5"/>
  <text x="645" y="145" class="mono" font-size="10" fill="#7c8f6f" font-weight="600" text-anchor="middle">EffNet V2 (77.4%)</text>

  <!-- EffNet V3 (square, focal best) -->
  <rect x="415" y="116" width="14" height="14" rx="2" fill="#f5f5f5"/>
  <rect x="415" y="116" width="14" height="14" rx="2" fill="rgba(235,108,54,0.20)" stroke="#eb6c36" stroke-width="1.5"/>
  <rect x="436" y="98" width="112" height="18" rx="4" fill="#f5f5f5"/>
  <text x="492" y="111" class="mono" font-size="10" fill="#eb6c36" font-weight="700" text-anchor="middle">EffNet V3 (80.6%)</text>

  <!-- EffNet Trajectory Delta Badges -->
  <rect x="687" y="176" width="72" height="30" rx="4" fill="#f5f5f5" stroke="rgba(28,25,23,0.12)" stroke-width="0.6"/>
  <text x="723" y="189" class="mono" font-size="9" fill="#047857" font-weight="600" text-anchor="middle">+4.9% Acc</text>
  <text x="723" y="201" class="mono" font-size="8" fill="#eb6c36" font-weight="600" text-anchor="middle">−0.041 CKA</text>

  <rect x="488" y="127" width="72" height="30" rx="4" fill="#f5f5f5" stroke="rgba(28,25,23,0.12)" stroke-width="0.6"/>
  <text x="524" y="140" class="mono" font-size="9" fill="#047857" font-weight="600" text-anchor="middle">+3.2% Acc</text>
  <text x="524" y="152" class="mono" font-size="8" fill="#eb6c36" font-weight="600" text-anchor="middle">−0.042 CKA</text>

  <!-- ==================== LEGEND STRIP ==================== -->
  <line x1="100" y1="510" x2="820" y2="510" stroke="rgba(28,25,23,0.10)" stroke-width="0.8"/>
  <text x="100" y="534" fill="#78716c" font-size="8" class="mono" letter-spacing="0.14em">LEGEND</text>

  <!-- ResNet legend -->
  <circle cx="178" cy="530" r="5" fill="#f5f5f5" stroke="#2d3142" stroke-width="1.5"/>
  <text x="192" y="534" fill="#4f5d75" font-size="10" font-weight="500">ResNet-18 (V1 → V3)</text>

  <!-- EffNet legend -->
  <rect x="368" y="525" width="10" height="10" rx="2" fill="rgba(124,143,111,0.25)" stroke="#7c8f6f" stroke-width="1.2"/>
  <text x="386" y="534" fill="#4f5d75" font-size="10" font-weight="500">EfficientNet-B2 (V1 → V3)</text>

  <!-- Focal best legend -->
  <rect x="588" y="525" width="10" height="10" rx="2" fill="rgba(235,108,54,0.20)" stroke="#eb6c36" stroke-width="1.5"/>
  <text x="606" y="534" fill="#4f5d75" font-size="10" font-weight="500">EffNet V3 (Overall Best Acc)</text>
</svg>

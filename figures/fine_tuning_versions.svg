<svg viewBox="0 0 680 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#dc5050"/>
    </marker>
    <!-- Padlock icon -->
    <g id="padlock">
      <rect x="-6" y="-2" width="12" height="10" rx="1.5" fill="rgba(45,49,66,0.3)" stroke="none"/>
      <path d="M-3 -2 v-2 a3 3 0 0 1 6 0 v2" fill="none" stroke="rgba(45,49,66,0.3)" stroke-width="2"/>
      <circle cx="0" cy="3" r="1.5" fill="#f5f5f5"/>
    </g>
  </defs>

  <style>
    .font-sans { font-family: 'Geist', sans-serif; }
    .font-mono { font-family: 'Geist Mono', monospace; }
  </style>

  <!-- ==================== Single Backbone ==================== -->
  <g transform="translate(60, 60)">
    <!-- Preceding Dots (indicates previous layers) -->
    <circle cx="4" cy="80" r="2" fill="#78716c"/>
    <circle cx="16" cy="80" r="2" fill="#78716c"/>
    <circle cx="28" cy="80" r="2" fill="#78716c"/>
    <line x1="34" y1="80" x2="40" y2="80" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
    
    <!-- Connectors -->
    <line x1="72" y1="80" x2="120" y2="80" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="168" y1="80" x2="224" y2="80" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="288" y1="80" x2="360" y2="80" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="440" y1="80" x2="528" y2="80" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
    
    <!-- BLOCK[-4] (Frozen) -->
    <rect x="40" y="20" width="32" height="120" rx="4" fill="#f5f5f5"/>
    <rect x="40" y="20" width="32" height="120" rx="4" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.2)" stroke-width="1.2" stroke-dasharray="4,4"/>
    <use href="#padlock" x="56" y="80"/>

    <!-- BLOCK[-3] (Unfrozen, V3 starts here) -->
    <rect x="120" y="32" width="48" height="96" rx="4" fill="#f5f5f5"/>
    <rect x="120" y="32" width="48" height="96" rx="4" fill="rgba(220,80,80,0.05)" stroke="#dc5050" stroke-width="1.2"/>

    <!-- BLOCK[-2] (Unfrozen) -->
    <rect x="224" y="44" width="64" height="72" rx="4" fill="#f5f5f5"/>
    <rect x="224" y="44" width="64" height="72" rx="4" fill="rgba(220,80,80,0.05)" stroke="#dc5050" stroke-width="1.2"/>

    <!-- BLOCK[-1] (Unfrozen, V2 starts here) -->
    <rect x="360" y="56" width="80" height="48" rx="4" fill="#f5f5f5"/>
    <rect x="360" y="56" width="80" height="48" rx="4" fill="rgba(220,80,80,0.05)" stroke="#dc5050" stroke-width="1.2"/>

    <!-- HEAD (Unfrozen, V1 starts here) -->
    <rect x="528" y="28" width="16" height="104" rx="2" fill="#f5f5f5"/>
    <rect x="528" y="28" width="16" height="104" rx="2" fill="rgba(220,80,80,0.05)" stroke="#dc5050" stroke-width="1.2"/>

    <!-- Bottom Axis labels -->
    <text x="56" y="160" fill="#78716c" font-size="9" class="font-mono" text-anchor="middle" letter-spacing="0.1em">BLOCK[-4]</text>
    <text x="144" y="160" fill="#78716c" font-size="9" class="font-mono" text-anchor="middle" letter-spacing="0.1em">BLOCK[-3]</text>
    <text x="256" y="160" fill="#78716c" font-size="9" class="font-mono" text-anchor="middle" letter-spacing="0.1em">BLOCK[-2]</text>
    <text x="400" y="160" fill="#78716c" font-size="9" class="font-mono" text-anchor="middle" letter-spacing="0.1em">BLOCK[-1]</text>
    <text x="536" y="160" fill="#78716c" font-size="9" class="font-mono" text-anchor="middle" letter-spacing="0.1em">HEAD</text>
  </g>

  <!-- ==================== Version Labels ==================== -->
  <g transform="translate(60, 60)">
    <!-- V3 Indicator -->
    <text x="144" y="-4" fill="#1c1917" font-size="16" font-weight="600" class="font-sans" text-anchor="middle">DEEP (V3)</text>
    <path d="M 144,4 V 24" stroke="#dc5050" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    
    <!-- V2 Indicator -->
    <text x="400" y="-4" fill="#1c1917" font-size="16" font-weight="600" class="font-sans" text-anchor="middle">PARTIAL (V2)</text>
    <path d="M 400,4 V 48" stroke="#dc5050" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    
    <!-- V1 Indicator -->
    <text x="536" y="-4" fill="#1c1917" font-size="16" font-weight="600" class="font-sans" text-anchor="middle">BASELINE (V1)</text>
    <path d="M 536,4 V 20" stroke="#dc5050" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  </g>
</svg>
